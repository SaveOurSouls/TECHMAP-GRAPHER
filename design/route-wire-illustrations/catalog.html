<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Маршрутная карта · виды проводов</title>
<style>
  :root{font-family:Segoe UI,Arial,sans-serif;color:#263744;background:#f5f8fa}body{max-width:1180px;margin:38px auto;padding:0 24px}h1{font-size:28px;margin:0 0 8px}p{color:#526574;margin:0 0 26px;line-height:1.5}.grid{display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe4e9;border-radius:12px;padding:13px 18px 10px;display:grid;grid-template-columns:270px 1fr;align-items:center;gap:12px}.meta{display:grid;gap:5px}.meta strong{font-size:14px}.meta small{color:#60727f;font-size:12px}.card img{width:100%;height:88px;object-fit:contain}@media(max-width:700px){.card{grid-template-columns:1fr}.card img{height:95px}}
</style>
<h1>Типовые виды подготовки провода</h1>
<p>Комплект для маршрутной карты · 13 отдельных SVG · цвет изоляции условный · рисунок показывает состояние концов, а размеры и материалы берутся из данных маршрута.</p>
<div class="grid" id="grid"></div>
<script>
const entries=[
  ["01-cut","1 · Нарезан"],["02-strip-one","2 · Зачищен один конец"],["02-strip-both","2 · Зачищены оба конца"],["03-tin-one","3 · Лужён один конец, второй — медь"],["03-tin-both","3 · Лужены оба конца"],["04-crimp-copper","4 · Наконечник + медь"],["04-crimp-tin","4 · Наконечник + лужение"],["05-crimp-both","5 · Два наконечника"],["06-seal-copper","6 · Уплотнитель + медь"],["06-seal-tin","6 · Уплотнитель + лужение"],["07-seal-terminal","7 · Уплотнённый и обычный наконечники"],["08-seal-both-female","8 · Два уплотнителя, гнездовые контакты"],["08-seal-both-mixed","8 · Два уплотнителя, разные контакты"]
];
grid.innerHTML=entries.map(([id,title])=>`<div class="card"><div class="meta"><strong>${title}</strong><small>${id}.svg</small></div><img src="../../src/Techmap.Client/public/route-wire-illustrations/${id}.svg" alt="${title}"></div>`).join("");
</script></html>
