 · медь · лужёная медь · pin · socket</text><text x="613" y="572" class="small" >pin+seal · socket+seal · lug. Восемь вариантов одного объекта.</text><text x="28" y="655" class="small" >Все изображения — проектные макеты. Геометрия не определяет электрическую связность или производственную длину.</text></svg>
