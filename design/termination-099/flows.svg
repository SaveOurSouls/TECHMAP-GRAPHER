<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title"><title id="title">Потоки многопроводных оконцовок 099</title><style>svg{font-family:Arial,'Segoe UI',sans-serif} .geom{stroke:#334155;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round} .geom text{stroke:none;stroke-width:0} .detail{stroke:#8593a3;stroke-width:1;fill:none} .wire{stroke:#69798a;stroke-width:3;fill:none;stroke-linecap:round} .text{font-size:12px;fill:#334155;stroke:none} .small{font-size:10px;fill:#64748b;stroke:none} .title{font-size:25px;fill:#0f172a;font-weight:700;stroke:none} .card-title{font-size:17px;fill:#1e293b;font-weight:700;stroke:none} .view{font-size:11px;fill:#237ca3;font-weight:700;stroke:none} .badge{font-size:11px;fill:#1684ba;font-weight:700;stroke:none} .dim{stroke:#5f8f87;stroke-width:1;fill:none} .dimtext{font-size:11px;fill:#427a70;stroke:none}</style><rect x="0" y="0" width="1160" height="690" rx="0" fill="#f3f6fa"/><text x="28" y="44" class="title" >099 · Многопроводные подключения</text><text x="28" y="73" class="text" >Несколько проводов присоединяются к существующему якорю. Счётчик ×n не является портом.</text><g transform="translate(28,101)"><rect x="0" y="0" width="348" height="228" rx="12" fill="#ffffff"/><text x="18" y="29" class="card-title" >2 провода · один наконечник</text><path d="M22 71.0 H55 Q89 71.0 130 122" fill="none" class="wire"/><path d="M22 171.0 H55 Q89 171.0 130 122" fill="none" class="wire"/><g transform="translate(98,72) scale(1.05)"><g class="geom"><line x1="7" y1="50" x2="32" y2="50" class="wire"/><path d="M32 32 H82 L95 37 V63 L82 68 H32 Z" fill="#d95f59" /><path d="M83 37 H107 L126 29 Q166 18 177 50 Q166 82 126 71 L107 63 H83 Z" fill="#dbe5ee" /><circle cx="151" cy="50" r="13" fill="#ffffff" /><path d="M36 37 H80 M36 63 H80 M89 40 V60" fill="none" class="detail"/></g><circle cx="32" cy="50" r="4.8" fill="#ffffff" data-role="wire-entry" stroke="#1684ba" stroke-width="2