</defs><rect x="0" y="0" width="1240" height="1340" rx="0" fill="#f3f6fa"/><text x="28" y="44" class="title" >099 · НШВИ · стандартный и широкий раструбы</text><text x="28" y="72" class="text" >Фронтальные 2D профили по C1–C3; цвет — исполнение, без привязки к сечению.</text><text x="28" y="94" class="small" >Один вход провода у каждой формы. Э4 и Чертёж используют один и тот же контур.</text><rect x="28" y="119" width="584" height="480" rx="12" fill="#ffffff"/><text x="46" y="149" class="card-title" >Стандартный раструб</text><text x="46" y="173" class="view" >Чертёж · фронтальный вид, трубка вверх</text><g transform="translate(228,539) scale(2.5) rotate(-90) translate(-32,-50)"><g class="geom"><path d="M32 38 Q32 36 36 36 H66 Q70 36 74 40 L86 44 V56 L74 60 Q70 64 66 64 H36 Q32 64 32 62 Z" fill="#8d959c" /><path d="M86 43 H174 Q177 43 177 45 V55 Q177 57 174 57 H86 Z" fill="url(#metal)" /><path d="M90 45 H174 M90 55 H174 M36 39 H64 M36 61 H64" fill="none" class="detail"/><path d="M38 38 C35 42 35 58 38 62" fill="none" class="detail"/></g><circle cx="32" cy="50" r="4.8" fill="#ffffff" data-role="wire-entry" stroke="#1684ba" stroke-width="2.2"/></g><text x="328" y="339" class="view" >Э4 · рабочий вид</text><g transform="translate(308,359)"><g class="geom"><line x1="7" y1="50" x2="32" y2="50" class="wire"/><path d="M32 38 Q32 36 36 36 H66 Q70 36 74 40 L86 44 V56 L74 60 Q70 64 66 64 H36 Q32 64 32 62 Z" fill="#fff" /><path d="M86 43 H174 Q177 43 177 45 V55 Q177 57 174 57 H86 Z" fill="#fff" /></g><circle cx="32" cy="50" r="4.8" fill="#ffffff" data-role="wire-entry" stroke="#1684ba" stroke-width="2.2"/></g><text x="46" y="575" class="small" >Геометрия стандартного раструба сохранена.</text><rect x="636" y="119" width="584" height="480" rx="12" fill="#ffffff"/><text x="654" y="149" class="card-title" >Широкий раструб · C1 / C2</text><text x="654" y="173" class="view" >Чертёж · фронтальный вид, трубка вверх</text><g transform="translate(836,539) scale(2.5) rotate(-90) transl