<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="460" viewBox="0 0 1180 460" role="img" aria-labelledby="title"><title id="title">Размерные поля 099</title><style>svg{font-family:Arial,'Segoe UI',sans-serif} .geom{stroke:#334155;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round} .geom text{stroke:none;stroke-width:0} .detail{stroke:#8593a3;stroke-width:1;fill:none} .wire{stroke:#69798a;stroke-width:3;fill:none;stroke-linecap:round} .text{font-size:12px;fill:#334155;stroke:none} .small{font-size:10px;fill:#64748b;stroke:none} .title{font-size:25px;fill:#0f172a;font-weight:700;stroke:none} .card-title{font-size:17px;fill:#1e293b;font-weight:700;stroke:none} .view{font-size:11px;fill:#237ca3;font-weight:700;stroke:none} .badge{font-size:11px;fill:#1684ba;font-weight:700;stroke:none} .dim{stroke:#5f8f87;stroke-width:1;fill:none} .dimtext{font-size:11px;fill:#427a70;stroke:none}</style><rect x="0" y="0" width="1180" height="460" rx="0" fill="#f3f6fa"/><text x="28" y="44" class="title" >099 · Поля размеров C1 / C2</text><text x="28" y="70" class="text" >Иллюстративная геометрия. Размеры артикула задаются данными каталога; пиксели не являются миллиметрами.</text><text x="70" y="115" class="card-title" >C1 · НКИ / НВИ</text><g transform="translate(82,136) scale(1.9)"><g class="geom"><line x1="7" y1="50" x2="32" y2="50" class="wire"/><path d="M32 32 H82 L95 37 V63 L82 68 H32 Z" fill="#d95f59" /><path d="M83 37 H107 L126 29 Q166 18 177 50 Q166 82 126 71 L107 63 H83 Z" fill="#dbe5ee" /><circle cx="151" cy="50" r="13" fill="#ffffff" /><path d="M36 37 H80 M36 63 H80 M89 40 V60" fill="none" class="detail"/></g><circle cx="32" cy="50" r="4.8" fill="#ffffff" data-role="wire-entry" stroke="#1684ba" stroke-width="2.2"/></g><line x1="143" y1="143" x2="424" y2="143" class="dim"/><line x1="143" y1="137" x2="143" y2="151" class="dim"/><line x1="424" y1="137" x2="424" y2="151" class="dim"/><text x="274" y="135" class="dimtext" >L</text><text x="70" y="345" class="small" >L — общая длина · L1 — зона металлического обжима</text><text x="70" y="367" class="small" >D — отверстие кольца / раскрытие вилки · B — ширина лепестка</text><text x="70" y="389" class="small" >d1 — входной диаметр · P — длина хвостовой зоны · S — толщина</text><text x="650" y="115" class="card-title" >C2 · НШВИ · трубчатые варианты</text><g transform="translate(662,136) scale(1.9)"><g class="geom"><line x1="7" y1="50" x2="32" y2="50" class="wire"/><path d="M32 29 H64 Q76 29 85 40 H92 V60 H85 Q76 71 64 71 H32 Z" fill="#d95f59" /><rect x="92" y="41" width="81" height="18" rx="2" fill="#dbe5ee"/><path d="M97 45 H167 M97 55 H167" fill="none" class="detail"/><path d="M38 35 H63 M38 65 H63" fill="none" class="detail"/><text x="178" y="29" class="badge" >×2</text></g><circle cx="32" cy="50" r="4.8" fill="#ffffff" data-role="wire-entry" stroke="#1684ba" stroke-width="2.2"/></g><line x1="723" y1="143" x2="1004" y2="143" class="dim"/><line x1="723" y1="137" x2="723" y2="151" class="dim"/><line x1="1004" y1="137" x2="1004" y2="151" class="dim"/><text x="854" y="135" class="dimtext" >L1</text><text x="650" y="345" class="small" >L — металлическая втулка · L1 — общая длина</text><text x="650" y="367" class="small" >C — диаметр втулки · W — габарит раструба</text><text x="650" y="389" class="small" >A — поперечный габарит; НШВИ-2 — расширение проекта</text><text x="28" y="431" class="small" >Схема только сохраняет названия полей приложений; значения и допуски не выдуманы.</text></svg>
